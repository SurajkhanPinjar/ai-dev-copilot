spring:
  application:
    name: ai-backend

server:
  port: 8080

ollama:
  base-url: http://localhost:11434
  chat-model: mistral:latest
  embedding-model: nomic-embed-text:latest

qdrant:
  host: localhost
  port: 6334
  collection: ai-dev-copilot

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

info:
  app:
    name: AI Dev Copilot
    description: AI-powered Backend Engineering Assistant
    version: 1.0.0