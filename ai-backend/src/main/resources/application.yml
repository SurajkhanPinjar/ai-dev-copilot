spring:
  application:
    name: ai-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

ollama:
  base-url: http://localhost:11434
  chat-model: mistral:latest
  embedding-model: nomic-embed-text:latest

rag:
  storage:
    upload-dir: uploads

  vector:
    dimensions: 768
    top-k: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    io.aidevcopilot: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

info:
  app:
    name: AI Dev Copilot
    description: AI-powered Backend Engineering Assistant
    version: 1.0.0